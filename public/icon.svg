<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <filter id="favPortalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="favLeftRibbon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D81B60" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#FF4081" />
    </linearGradient>

    <linearGradient id="favTopArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#FF8A65" />
    </linearGradient>

    <linearGradient id="favCyanSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <linearGradient id="favOuterCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="50%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <radialGradient id="favCoreSpace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1B3E" />
      <stop offset="60%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#040714" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="90" fill="#0A0D18" />

  <!-- Portal Core -->
  <circle cx="255" cy="200" r="70" fill="url(#favCoreSpace)" />
  <circle cx="265" cy="205" r="35" fill="#00E5FF" opacity="0.35" />

  <!-- Swirl Crescents -->
  <path d="M 270 115 C 330 130 365 185 355 245 C 345 300 295 335 235 320 C 305 325 345 285 345 235 C 345 180 310 130 270 115 Z" fill="url(#favOuterCyan)" filter="url(#favPortalGlow)" />
  <path d="M 205 85 C 265 75 330 105 345 165 C 325 125 270 100 215 110 C 245 95 285 95 310 110 C 265 90 225 90 205 85 Z" fill="url(#favTopArch)" />

  <!-- Monogram N Left Stem & Cyan Sweep -->
  <path d="M 70 315 C 60 280 75 190 85 150 C 95 115 125 105 145 125 C 120 125 102 165 98 235 C 95 285 68 315 70 315 Z" fill="url(#favLeftRibbon)" filter="url(#favPortalGlow)" />
  <path d="M 85 150 C 95 115 130 100 160 115 C 185 130 200 165 210 210 C 195 165 175 135 150 125 C 130 118 105 125 85 150 Z" fill="url(#favTopArch)" />
  <path d="M 115 155 C 135 185 165 240 195 295 C 225 340 270 350 315 325 C 265 345 220 330 190 285 C 160 235 135 185 115 155 Z" fill="url(#favCyanSweep)" filter="url(#favPortalGlow)" />

  <!-- Starlets -->
  <polygon points="262,175 264,182 271,184 264,186 262,193 260,186 253,184 260,182" fill="#FF8A65" />
  <polygon points="135,95 137,103 145,105 137,107 135,115 133,107 125,105 133,103" fill="#00E5FF" />
</svg>